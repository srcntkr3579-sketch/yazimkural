      <div id="message"></div>

  </div>
</div>

L(`

/* ========== OYUN MOTORU ========== */
const STAGE=10;
let queue=[],i=0,errors=0,streak=0,best=0,lock=false,N=0,stageStart=0,stageLen=0,missed={};
const $=id=>document.getElementById(id);
function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];}return a;}

$('bank-info').innerText='Soru bankasında toplam '+BANK.length+' farklı soru var: büyük harf, de/da, soru eki, ki, kesme işareti, yazım kuralı ve noktalama.';

function startGame(n){
  N=n===0?BANK.length:Math.min(n,BANK.length);
  queue=shuffle(BANK.slice()).slice(0,N);
  i=0;errors=0;streak=0;best=0;lock=false;missed={};
  $('start-screen').style.display='none';
  $('game-screen').style.display='block';
  beginStage();
}
function beginStage(){
  stageStart=i;
  stageLen=Math.min(STAGE,N-i);
  drawMap();
  loadQuestion();
}
function drawMap(lava){
  const pos=i-stageStart;
  const g=$('grid');g.innerHTML='';
  for(let c=0;c<=stageLen;c++){
    const d=document.createElement('div');d.className='cell';
    if(c===pos){ if(lava){d.className+=' lava';d.innerHTML='🔥';} else d.innerHTML=(c===stageLen)?'🧑‍🦱':'🧑‍🦱'; }
    else if(c===stageLen){d.className+=' diamond';d.innerHTML='💎';}
    else if(c<pos){d.className+=' done';d.innerHTML='🟫';}
    else d.innerHTML='🟩';
    g.appendChild(d);
  }
  const totalStages=Math.ceil(N/STAGE),curStage=Math.floor(stageStart/STAGE)+1;
  $('stage-title').innerText='Bölüm '+curStage+' / '+totalStages;
  $('bar-fill').style.width=(i/N*100)+'%';
  $('st-q').innerText=Math.min(i,N)+' / '+N;
  $('st-err').innerText=errors;
  $('st-streak').innerText=streak;
}
function loadQuestion(){
  lock=false;
  $('message').innerText='';$('message').className='';
  if(i>=N){return finish();}
  const q=queue[i];
  $('qtitle').innerText='Soru '+(i+1)+' / '+N;
  $('qcat').innerText=q.cat;
  $('hint').innerText=q.hint||'';
  $('qtext').innerText=q.q;
  const order=shuffle([0,1]);
  const box=$('options');box.innerHTML='';
  order.forEach(idx=>{
    const b=document.createElement('button');b.className='btn-ans';b.innerText=q.opts[idx];
    b.dataset.ok=idx===0?'1':'0';
    b.onclick=()=>answer(b,idx===0);
    box.appendChild(b);
  });
}
function answer(btn,isRight){
  if(lock)return;lock=true;
  const q=queue[i],msg=$('message');
  document.querySelectorAll('.btn-ans').forEach(b=>{b.disabled=true;if(b.dataset.ok==='1')b.classList.add('ok');});
  if(isRight){
    streak++;best=Math.max(best,streak);i++;
    msg.className='success';msg.innerText='Doğru Cevap! 🟩 Karakterin 1 adım ilerledi!\n'+q.note;
    drawMap();
    if(i-stageStart>=stageLen){
      msg.innerText='💎 Elması aldın! Bölüm tamamlandı!';
      setTimeout(()=>{ if(i>=N) finish(); else beginStage(); },1500);
    } else setTimeout(loadQuestion,1800);
  } else {
    btn.classList.add('bad');
    errors++;streak=0;missed[q.cat]=(missed[q.cat]||0)+1;
    msg.className='error';msg.innerText='Yanlış Cevap! 💥 Karakter lavlara düştü. Bölüm başa sarıyor!\nKural: '+q.note;
    drawMap(true);
    setTimeout(()=>{
      i=stageStart;
      const rest=shuffle(queue.slice(stageStart));
      queue=queue.slice(0,stageStart).concat(rest);
      drawMap();loadQuestion();
    },3500);
  }
}
function finish(){
  drawMap();
  $('bar-fill').style.width='100%';
  $('stage-title').innerText='Elmaslara ulaştın!';
  const acc=Math.round(N/(N+errors)*100);
  let weak='';
  const arr=Object.entries(missed).sort((a,b)=>b[1]-a[1]);
  if(arr.length) weak='<p>En çok zorlandığın konular: <b>'+arr.slice(0,3).map(x=>x[0]+' ('+x[1]+')').join(', ')+'</b></p>';
  $('game-screen').innerHTML='<h3 style="margin-top:0;color:#ffcc00;">🏆 OYUN BİTTİ!</h3>'
   +'<p style="font-size:18px">Tebrikler! '+N+' soruyu tamamladın, imla canavarını yendin! 🎉</p>'
   +'<p>Toplam hata: <b>'+errors+'</b> · En uzun doğru serisi: <b>'+best+'</b> · Doğruluk: <b>%'+acc+'</b></p>'+weak
   +'<button class="btn-mode" onclick="location.reload()">🔁 Yeniden Oyna</button>';
}
drawMap();
</script>
